<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f5fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>이화에 지는 달</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   이화(梨花)에 지는 달 : 대치동 환생록
   단일 파일 하이브리드 앱(WebView) 빌드
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0a10;overscroll-behavior:none;overflow:hidden}
body{
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;-webkit-text-size-adjust:100%;
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;user-select:text;-webkit-user-select:text}

/* ---------- THEME TOKENS ---------- */
#app{
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --serif:'Nanum Myeongjo','Noto Serif KR','AppleMyungjo','Batang',serif;
  --paper:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .92  0 0 0 0 .82  0 0 0 0 .62  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#app.day{
  --bg:#f6f4fa; --bg2:#eef1fb; --panel:#ffffff; --panel2:#f7f7fc; --ink:#2a2c40; --sub:#8b8fa7;
  --line:rgba(40,40,80,.08); --accent:#f07fa8; --accent2:#7ea7f6; --accent3:#9b8cf2; --good:#36b38a; --bad:#e86a6a;
  --shadow:0 6px 22px rgba(70,70,130,.08); --radius:18px; --font:var(--sans);
  --btn:linear-gradient(135deg,#f58db2,#a98cf5); --btnink:#fff; --chip:#f1f0f8;
}
#app.night{
  --bg:#0f0909; --bg2:#1a0f0d; --panel:#1d1210; --panel2:#251714; --ink:#eadcc0; --sub:#9c8a72;
  --line:rgba(201,165,90,.22); --accent:#c9a55a; --accent2:#9a2a22; --accent3:#d8b977; --good:#b9c27a; --bad:#d4553f;
  --shadow:0 6px 26px rgba(0,0,0,.5); --radius:6px; --font:var(--serif);
  --btn:linear-gradient(135deg,#8e1f1a,#5a120f); --btnink:#f3e2bb; --chip:#2b1a16;
}
#app{
  position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;
  background:var(--bg);color:var(--ink);font-family:var(--font);
  display:flex;flex-direction:column;transition:background .9s,color .9s;
}
#app.night{background-image:var(--paper),radial-gradient(120% 80% at 50% 0%,#2a1410 0%,#0f0909 60%)}

/* ---------- STATUS BAR ---------- */
#status{
  flex:none;z-index:6;position:relative;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;align-items:center;font-size:12px;
  transition:background .9s;
}
.night #status{background:rgba(25,14,12,.92);background-image:var(--paper)}
#status .date b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px}
#status .date span{color:var(--sub);font-size:11px}
.meter{display:flex;flex-direction:column;gap:3px;min-width:0}
.meter .lb{display:flex;justify-content:space-between;color:var(--sub);font-size:10.5px}
.meter .lb b{color:var(--ink);font-weight:700}
.bar{height:7px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .6s ease}
.bar.hp i{background:linear-gradient(90deg,#5fd3a5,#3bb4d8)}
.bar.st i{background:linear-gradient(90deg,#ffb36b,#f0647a)}
.night .bar.hp i{background:linear-gradient(90deg,#7e8d4a,#c2b36a)}
.night .bar.st i{background:linear-gradient(90deg,#a2361f,#e05a3a)}
#status .money{text-align:right}
#status .money b{display:block;font-size:13.5px;font-weight:800}
#status .money span{color:var(--sub);font-size:10.5px}

/* ---------- MAIN VIEW ---------- */
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 14px 22px;position:relative;z-index:2}
#view::-webkit-scrollbar{display:none}
.tab{display:none;animation:fadeUp .35s ease}
.tab.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--panel);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative}
.night .card{background-color:var(--panel);background-image:var(--paper)}
.card h3{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3 small{font-weight:500;color:var(--sub);font-size:11px;margin-left:auto}
.muted{color:var(--sub);font-size:12px;line-height:1.6}
.hero{
  border-radius:var(--radius);padding:16px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#f6a2c1 0%,#a99af7 55%,#86b6fb 100%);box-shadow:var(--shadow);
}
.hero.summer{background:linear-gradient(135deg,#6fd6e8,#6aa4f7 60%,#7c8df2)}
.hero.autumn{background:linear-gradient(135deg,#f7b36d,#ec7f78 55%,#b07ad9)}
.hero.winter{background:linear-gradient(135deg,#a9c4f2,#8a9ae6 55%,#6c6fc7)}
.hero .big{font-size:21px;font-weight:900;letter-spacing:-.5px}
.hero .ev{display:inline-block;margin-top:6px;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.hero .hint{margin-top:8px;font-size:12px;opacity:.95;line-height:1.55}
.hero .moon{position:absolute;right:-10px;top:-14px;font-size:84px;opacity:.22}

/* schedule slots */
.slot{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel2);margin-bottom:9px;border:1.5px dashed var(--line);transition:transform .15s}
.slot:active{transform:scale(.98)}
.slot.set{border-style:solid;border-color:transparent;background:var(--panel2)}
.slot .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--chip);flex:none}
.slot .tx{flex:1;min-width:0}
.slot .tl{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.2px}
.slot .nm{font-size:14px;font-weight:800;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .who{font-size:18px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--chip);color:var(--ink);font-weight:700;white-space:nowrap}
.chip.up{color:var(--good)} .chip.dn{color:var(--bad)}
.chip.money{color:#c58a1b}
.row{display:flex;gap:8px}
.btn{flex:1;padding:13px 10px;border-radius:14px;font-weight:800;font-size:14px;background:var(--chip);color:var(--ink);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--btn);color:var(--btnink);box-shadow:0 6px 18px rgba(240,127,168,.3)}
.night .btn.pri{box-shadow:0 6px 18px rgba(140,20,10,.4);border:1px solid rgba(201,165,90,.4)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{padding:9px 8px;font-size:12.5px;border-radius:11px;flex:none}
.summary{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:4px 2px 12px}
.summary b{color:var(--ink)}

/* stats */
.prof{display:flex;gap:12px;align-items:center}
.avatar{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#ffd1e1,#cbd6ff)}
.night .avatar{background:linear-gradient(135deg,#5a1a14,#2a1410);border:1px solid var(--accent)}
.prof .nm{font-size:18px;font-weight:900}
.prof .gl{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5}
.stat{display:grid;grid-template-columns:62px 1fr 46px;align-items:center;gap:8px;margin:9px 0;font-size:12.5px}
.stat .bar{height:9px}
.stat .bar i{background:linear-gradient(90deg,var(--accent2),var(--accent3))}
.stat .gv{text-align:right;font-weight:800;font-size:12px}
.stat .gv em{font-style:normal;font-size:10px;color:var(--sub);margin-left:3px}
.aff{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.aff:last-child{border-bottom:0}
.aff .em{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.aff .info{flex:1;min-width:0}
.aff .info b{font-size:13.5px}
.aff .info span{font-size:11px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{font-size:12px;letter-spacing:1px;color:var(--accent)}
.fit{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0}
.fit .bar{flex:1;margin:6px 10px 0}
.fit .bar i{background:var(--btn)}

/* phone */
.phone{border-radius:28px;background:#1d1e26;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.phone-in{background:#f3f4f9;border-radius:20px;min-height:440px;overflow:hidden;display:flex;flex-direction:column;color:#24253a;font-family:var(--sans)}
.phone-top{padding:12px 14px;background:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eceef5}
.phone-top .back{font-size:18px;padding:0 6px 0 0}
.room{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#fff;border-bottom:1px solid #f0f1f6}
.room:active{background:#f6f6fb}
.room .em{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:20px;flex:none}
.room .mid{flex:1;min-width:0}
.room .mid b{font-size:13.5px}
.room .mid span{display:block;font-size:12px;color:#8b8fa7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .badge{background:#ff5d73;color:#fff;font-size:10.5px;font-weight:800;border-radius:10px;padding:2px 7px}
.chat{flex:1;padding:12px;overflow-y:auto;max-height:52vh;display:flex;flex-direction:column;gap:8px;background:#bccbe0}
.bub{max-width:78%;padding:8px 11px;border-radius:14px;font-size:13px;line-height:1.5;word-break:keep-all;white-space:pre-wrap}
.bub.them{background:#fff;align-self:flex-start;border-top-left-radius:4px}
.bub.me{background:#ffe86b;align-self:flex-end;border-top-right-radius:4px}
.bub.sys{align-self:center;background:rgba(0,0,0,.18);color:#fff;font-size:11px;padding:3px 10px}
.bub-who{font-size:11px;color:#4a5068;margin-bottom:-4px;margin-left:2px}
.replies{padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff}
.replies button{padding:10px;border-radius:12px;background:#f1f2f8;font-size:13px;text-align:left;font-family:var(--sans)}
.replies button:active{background:#e3e5f3}
.empty{padding:40px 20px;text-align:center;color:#8b8fa7;font-size:13px}

/* codex */
.mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mem{aspect-ratio:3/4;border-radius:10px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;font-size:11px;line-height:1.35;position:relative;overflow:hidden;color:#f3e2bb;font-family:var(--serif);background:#231512;border:1px solid rgba(201,165,90,.35)}
.mem .n{font-size:10px;opacity:.75}
.mem b{font-size:12px}
.mem .glyph{position:absolute;top:8px;right:8px;font-size:22px;opacity:.8}
.mem.lock{background:repeating-linear-gradient(45deg,#2a2730,#2a2730 6px,#24212a 6px,#24212a 12px);color:#8e8a98;border-color:transparent}
.mem.lock .glyph{filter:grayscale(1);opacity:.35}
.ending{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ending .ic{font-size:20px;width:30px;text-align:center}
.ending.lock{color:var(--sub)}
.ending span{display:block;font-size:11px;color:var(--sub)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* system */
.sv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sv:last-child{border-bottom:0}
.sv .i{flex:1;font-size:13px}
.sv .i span{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:13px;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .seg{margin:0;width:170px}

/* ---------- DOCK ---------- */
#dock{
  flex:none;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--panel);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));transition:background .9s;
}
.night #dock{background:rgba(25,14,12,.95);background-image:var(--paper)}
#dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:10.5px;color:var(--sub);font-weight:700;position:relative;border-radius:12px}
#dock button .e{font-size:21px;filter:grayscale(.7);opacity:.75;transition:.2s}
#dock button.on{color:var(--ink)}
#dock button.on .e{filter:none;opacity:1;transform:translateY(-2px)}
#dock .dot{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:#ff5d73;color:#fff;font-size:9.5px;display:none;place-items:center;padding:0 4px}
#dock .dot.on{display:grid}

/* ---------- PARTICLES ---------- */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.pt{position:absolute;top:-30px;will-change:transform,opacity}
.pt.petal{width:11px;height:9px;background:radial-gradient(circle at 30% 30%,#fff,#fbe9ef 60%,#f6cfdc);border-radius:80% 0 80% 0;animation:fall linear infinite;opacity:.9;box-shadow:0 0 4px rgba(255,255,255,.6)}
.pt.sakura{width:12px;height:10px;background:radial-gradient(circle at 30% 30%,#ffe3ee,#f7a8c4);border-radius:80% 0 80% 0;animation:fall linear infinite}
.pt.leaf{width:12px;height:12px;background:linear-gradient(135deg,#f6a54b,#d9573a);border-radius:0 80% 0 80%;animation:fall linear infinite;opacity:.85}
.pt.snow{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:fall linear infinite;opacity:.9}
.pt.rain{width:1.5px;height:26px;background:linear-gradient(transparent,rgba(190,210,255,.75));animation:rain linear infinite;top:-40px}
.pt.ember{width:4px;height:4px;border-radius:50%;background:#ffb24a;box-shadow:0 0 8px 2px rgba(255,120,40,.85);animation:rise linear infinite;top:auto;bottom:-20px}
.pt.ink{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.55),transparent 70%);animation:inkfloat ease-in-out infinite;filter:blur(6px)}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx,60px),110vh,0) rotate(var(--rot,540deg))}}
@keyframes rain{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(-40px,110vh,0)}}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:1}100%{transform:translate3d(var(--dx,30px),-105vh,0);opacity:0}}
@keyframes inkfloat{0%,100%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(20px,-30px) scale(1.6);opacity:.55}}

/* ---------- OVERLAYS (shared) ---------- */
.layer{position:absolute;inset:0;display:none}
.layer.show{display:flex}

/* sheet */
#sheet{z-index:30;flex-direction:column;justify-content:flex-end;background:rgba(10,10,25,.45);animation:fade .2s}
#sheet .pane{background:var(--panel);border-radius:22px 22px 0 0;max-height:78%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom)}
.night #sheet .pane{background-image:var(--paper);border-radius:8px 8px 0 0;border-top:1px solid var(--accent)}
#sheet .hd{padding:16px 18px 8px;font-weight:900;font-size:16px;display:flex;align-items:center}
#sheet .hd small{color:var(--sub);font-weight:500;font-size:12px;margin-left:8px}
#sheet .hd .x{margin-left:auto;font-size:20px;color:var(--sub);padding:4px 8px}
#sheet .ls{overflow-y:auto;padding:4px 14px 16px;overscroll-behavior:contain}
.op{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--panel2);margin-bottom:8px;border:1.5px solid transparent;align-items:flex-start}
.op.sel{border-color:var(--accent)}
.op:active{transform:scale(.985)}
.op .ic{font-size:24px;width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none}
.op .tx{flex:1;min-width:0}
.op .tx b{font-size:14px}
.op .tx .pl{font-size:11px;color:var(--sub);margin-left:4px}
.op .tx p{font-size:12px;color:var(--sub);margin:3px 0 6px;line-height:1.5}
.op .meet{font-size:11px;font-weight:700;color:var(--accent);margin-top:5px}
.op.poor{opacity:.5}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* run overlay */
#run{z-index:35;flex-direction:column;background:var(--bg);transition:background .9s}
.night #run{background-image:var(--paper)}
#run .hd{padding:calc(16px + env(safe-area-inset-top)) 18px 10px;font-weight:900;font-size:18px}
#run .hd span{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-top:3px}
#run .ls{flex:1;overflow-y:auto;padding:4px 14px}
#run .ft{padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.log{display:flex;gap:11px;padding:12px;border-radius:14px;background:var(--panel);margin-bottom:9px;box-shadow:var(--shadow);animation:fadeUp .4s ease;border:1px solid var(--line)}
.log .ic{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none}
.log .tx{flex:1;min-width:0}
.log .tl{font-size:10.5px;color:var(--sub);font-weight:700}
.log b{font-size:13.5px}
.log p{font-size:12.5px;line-height:1.6;margin:3px 0 6px;color:var(--ink);opacity:.85;word-break:keep-all}
.log.warn{background:linear-gradient(135deg,#fff1f1,#fff);border-color:#f6c9c9}
.night .log.warn{background:#3a1512}
.log.sum{background:var(--panel2)}

/* modal */
#modal{z-index:90;align-items:center;justify-content:center;background:rgba(8,8,20,.55);padding:24px;animation:fade .2s}
#modal .box{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .25s}
.night #modal .box{background-image:var(--paper);border:1px solid var(--accent);border-radius:8px}
#modal h4{font-size:16px;font-weight:900;margin-bottom:8px}
#modal p{font-size:13px;line-height:1.7;color:var(--ink);opacity:.85;margin-bottom:14px;white-space:pre-line;word-break:keep-all}
#modal input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font-size:15px;margin-bottom:14px;outline:none}
#modal .btns{display:flex;gap:8px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

#toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:95;background:rgba(30,30,50,.88);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}

/* ---------- VISUAL NOVEL ---------- */
#vn{z-index:50;flex-direction:column;background:#000;overflow:hidden}
#vn-bg{position:absolute;inset:0;transition:background 1.2s ease,filter 1s;background-size:cover;background-position:center}
#vn-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 50%,rgba(0,0,0,.45))}
.night #vn-bg::after{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(10,0,0,.65)),var(--paper)}
#vn-deco{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:140px;opacity:.13;filter:blur(1.5px);pointer-events:none;transition:opacity 1s}
.night #vn-deco{opacity:.18;filter:blur(1px) sepia(1) hue-rotate(-20deg)}
#vn-stand{position:absolute;left:50%;bottom:150px;width:min(62%,260px);height:min(58vh,440px);transform:translateX(-50%) translateY(14px);opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;z-index:2}
#vn-stand.on{opacity:1;transform:translateX(-50%)}
#vn-stand img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom}
.sil{position:absolute;inset:0;filter:drop-shadow(0 0 22px var(--glow,rgba(255,255,255,.5)))}
.night .sil{filter:drop-shadow(0 0 20px rgba(200,50,30,.55)) sepia(.35) saturate(.85)}
.sil .hz{position:absolute;right:-6%;top:4%;writing-mode:vertical-rl;font-family:var(--serif);font-size:54px;font-weight:800;color:var(--c2);opacity:.28;letter-spacing:6px}
.sil .hair{position:absolute;top:3%;left:50%;width:44%;height:22%;transform:translateX(-50%);border-radius:50% 50% 30% 30%;background:var(--hair,#2a2a3a)}
.sil .head{position:absolute;top:7%;left:50%;width:34%;aspect-ratio:1/1.12;transform:translateX(-50%);border-radius:48% 48% 44% 44%;background:linear-gradient(160deg,var(--c1),var(--c2))}
.sil .neck{position:absolute;top:26%;left:50%;width:13%;height:8%;transform:translateX(-50%);background:var(--c2)}
.sil .body{position:absolute;top:31%;left:50%;width:88%;height:69%;transform:translateX(-50%);border-radius:46% 46% 6% 6%/26% 26% 4% 4%;background:linear-gradient(175deg,var(--c1) 0%,var(--c2) 70%);-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.sil .emb{position:absolute;top:46%;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.55);animation:bob 3.2s ease-in-out infinite}
.night .sil .emb{background:rgba(40,10,5,.4);border-color:rgba(201,165,90,.6)}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
#vn-stand.talk .sil{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}

#vn-tools{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:6px;z-index:6}
#vn-tools button{background:rgba(0,0,0,.35);color:#fff;font-size:11px;font-weight:800;padding:6px 10px;border-radius:20px;letter-spacing:.5px;backdrop-filter:blur(4px);font-family:var(--sans)}
#vn-tools button.on{background:var(--accent);color:#1b0f0b}
#vn-box{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));min-height:148px;z-index:5;padding:26px 18px 18px;border-radius:18px;background:rgba(255,255,255,.93);color:#26283c;box-shadow:0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--sans)}
.night #vn-box{background:rgba(22,12,10,.92);background-image:var(--paper);color:#efe1c4;border:1px solid rgba(201,165,90,.55);border-radius:4px;font-family:var(--serif);box-shadow:0 0 0 4px rgba(22,12,10,.6),0 0 0 5px rgba(201,165,90,.25),0 12px 40px rgba(0,0,0,.6)}
#vn-name{position:absolute;top:-14px;left:16px;padding:5px 16px;border-radius:20px;font-weight:900;font-size:13.5px;color:#fff;background:linear-gradient(135deg,#f58db2,#a98cf5);box-shadow:0 4px 12px rgba(0,0,0,.18);display:none}
#vn-name.on{display:block}
.night #vn-name{background:linear-gradient(135deg,#7a1712,#3d0c09);color:#f0d9a2;border:1px solid #c9a55a;border-radius:2px;font-family:var(--serif)}
#vn-text{font-size:15px;line-height:1.85;word-break:keep-all;white-space:pre-wrap;min-height:72px}
.night #vn-text{font-size:15.5px;line-height:1.95}
#vn-text.narr{color:#55586f;font-style:normal}
.night #vn-text.narr{color:#cdbb98}
#vn-next{position:absolute;right:16px;bottom:10px;font-size:12px;opacity:0;animation:blink 1s infinite}
#vn-next.on{opacity:1}
@keyframes blink{50%{opacity:.2}}
#vn-choices{position:absolute;left:0;right:0;top:0;bottom:180px;z-index:7;display:none;flex-direction:column;justify-content:center;gap:10px;padding:20px 26px;background:rgba(0,0,0,.25)}
#vn-choices.on{display:flex}
#vn-choices button{padding:15px 16px;border-radius:14px;background:rgba(255,255,255,.95);color:#2a2c40;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:fadeUp .35s ease both;line-height:1.45;word-break:keep-all;font-family:var(--sans)}
#vn-choices button.special{background:linear-gradient(135deg,#fff3c9,#ffd6e3);border:2px solid #f0b54a}
.night #vn-choices button{background:rgba(30,15,12,.95);background-image:var(--paper);color:#f0dfbb;border:1px solid rgba(201,165,90,.7);border-radius:3px;font-family:var(--serif)}
.night #vn-choices button.special{border:2px solid #f0c060;box-shadow:0 0 22px rgba(240,180,80,.45)}
#vn-choices button:active{transform:scale(.97)}
#vn-card{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.82);color:#f3e6c8;padding:30px;font-family:var(--serif)}
#vn-card.on{display:flex;animation:fade .8s}
#vn-card .k{font-size:12px;letter-spacing:6px;color:#c9a55a;margin-bottom:14px}
#vn-card .t{font-size:24px;font-weight:800;line-height:1.5;word-break:keep-all}
#vn-card .s{margin-top:14px;font-size:13px;opacity:.75;line-height:1.7;white-space:pre-line}
.day #vn-card{background:rgba(255,255,255,.88);color:#2a2c40;font-family:var(--sans)}
.day #vn-card .k{color:#e07aa0}
#vn-flash{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0}
#vn-flash.go{animation:flash .7s ease}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
#vn.shake #vn-bg,#vn.shake #vn-stand{animation:shake .5s}
@keyframes shake{0%,100%{translate:0}20%{translate:-8px 2px}40%{translate:7px -3px}60%{translate:-5px 1px}80%{translate:4px 0}}
#vn-log{position:absolute;inset:0;z-index:12;background:rgba(10,10,20,.92);color:#eee;display:none;flex-direction:column;font-family:var(--sans)}
#vn-log.on{display:flex}
#vn-log .ls{flex:1;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 18px 20px;font-size:13px;line-height:1.7}
#vn-log .ls p{margin-bottom:10px}
#vn-log .ls b{color:#f7a8c4;display:block;font-size:12px}
.night #vn-log .ls b{color:#c9a55a}
#vn-log .x{padding:14px;text-align:center;font-weight:800;background:rgba(255,255,255,.08)}

/* ---------- TITLE / INK TRANSITION ---------- */
#title{z-index:60;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 20%,#3b1a22 0%,#160b10 55%,#07050a 100%);color:#f3e3c3;font-family:var(--serif)}
#title .moonbig{position:absolute;top:9%;left:50%;transform:translateX(-50%);width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#fff8e6,#f1d9a8 55%,#c99f5b);box-shadow:0 0 80px 20px rgba(241,217,168,.35);animation:moon 8s ease-in-out infinite}
@keyframes moon{50%{box-shadow:0 0 110px 34px rgba(241,217,168,.45)}}
#title .branch{position:absolute;top:19%;left:-30px;font-size:120px;transform:rotate(-18deg);opacity:.85;filter:drop-shadow(0 0 10px rgba(255,255,255,.4))}
#title .tt{position:relative;margin-top:120px}
#title .tt .k{font-size:12px;letter-spacing:8px;color:#c9a55a}
#title .tt h1{font-size:34px;font-weight:800;margin:10px 0 4px;letter-spacing:-.5px;text-shadow:0 0 30px rgba(240,180,180,.4)}
#title .tt h1 small{font-size:20px;color:#e9b9c5}
#title .tt h2{font-size:15px;font-weight:400;letter-spacing:4px;color:#e6c9cf}
#title .menu{position:relative;margin-top:44px;display:flex;flex-direction:column;gap:10px;width:230px}
#title .menu button{padding:13px;border:1px solid rgba(201,165,90,.55);color:#f3e3c3;background:rgba(40,15,18,.55);font-size:15px;letter-spacing:3px;font-family:var(--serif);border-radius:3px;backdrop-filter:blur(4px)}
#title .menu button:active{background:rgba(120,30,30,.6)}
#title .menu button[disabled]{opacity:.35}
#title .ver{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font-size:11px;opacity:.5;letter-spacing:2px}
#ink{z-index:80;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(circle at 50% 55%,#000 0%,#000 45%,rgba(0,0,0,.96) 70%,#000 100%)}
#ink.on{opacity:1;pointer-events:all}
#ink .t{font-family:var(--serif);color:#d9c39a;font-size:16px;letter-spacing:4px;opacity:0;transition:opacity 1s .3s;text-align:center;line-height:2;white-space:pre-line}
#ink.on .t{opacity:1}
#ink.daybreak{background:radial-gradient(circle at 50% 50%,#fff 0%,#fdf6f9 60%,#f6f0ff 100%)}
#ink.daybreak .t{color:#7a6c8c;font-family:var(--sans)}

.ending-card{text-align:center;padding:26px 18px}
.ending-card .k{font-size:11px;letter-spacing:5px;color:var(--accent)}
.ending-card h2{font-size:21px;margin:8px 0 12px;word-break:keep-all}
.ending-card p{font-size:13px;line-height:1.8;opacity:.85;white-space:pre-line;word-break:keep-all}
.credits{position:absolute;inset:0;z-index:85;background:#000;color:#e8d8b6;font-family:var(--serif);display:none;overflow:hidden}
.credits.on{display:block}
.credits .roll{position:absolute;left:0;right:0;top:100%;text-align:center;line-height:2.2;font-size:14px;animation:roll 22s linear forwards}
.credits .roll h3{font-size:20px;color:#c9a55a;margin:30px 0 8px;letter-spacing:4px}
.credits .roll .sm{font-size:11px;opacity:.6;letter-spacing:3px}
.credits .skip{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));color:#aaa;font-size:12px;padding:6px 12px;border:1px solid #555;border-radius:20px;z-index:2;font-family:var(--sans)}
@keyframes roll{to{transform:translateY(calc(-100% - 100vh))}}
.letter{background:#f8f1e1;background-image:var(--paper);color:#3b2f22;font-family:var(--serif);padding:24px 20px;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.4);line-height:2;font-size:14px;white-space:pre-line;word-break:keep-all;transform:rotate(-1deg)}
</style>
</head>
<body>
<div id="app" class="day">
  <div class="fx" id="fx-main"></div>

  <header id="status">
    <div class="date"><b id="s-date">1학년 3월</b><span id="s-sub">봄 · 개학</span></div>
    <div class="meter"><div class="lb"><span>체력</span><b id="s-hp">100</b></div><div class="bar hp"><i id="s-hpb" style="width:100%"></i></div></div>
    <div class="meter"><div class="lb"><span>스트레스</span><b id="s-st">0</b></div><div class="bar st"><i id="s-stb" style="width:0%"></i></div></div>
    <div class="money"><b id="s-money">0원</b><span>용돈</span></div>
  </header>

  <main id="view">
    <section class="tab on" id="tab-schedule"></section>
    <section class="tab" id="tab-stats"></section>
    <section class="tab" id="tab-phone"></section>
    <section class="tab" id="tab-codex"></section>
    <section class="tab" id="tab-system"></section>
  </main>

  <nav id="dock">
    <button data-tab="schedule" class="on"><span class="e">📅</span>스케줄</button>
    <button data-tab="stats"><span class="e">🪪</span>내 정보</button>
    <button data-tab="phone"><span class="e">📱</span>스마트폰<i class="dot" id="dot-phone"></i></button>
    <button data-tab="codex"><span class="e">📜</span>전생 도감<i class="dot" id="dot-codex"></i></button>
    <button data-tab="system"><span class="e">⚙️</span>시스템</button>
  </nav>

  <!-- 시간표 선택 바텀시트 -->
  <div class="layer" id="sheet"><div class="pane"><div class="hd"><span id="sh-t"></span><small id="sh-s"></small><button class="x" id="sh-x">✕</button></div><div class="ls" id="sh-ls"></div></div></div>

  <!-- 주간 실행 오버레이 -->
  <div class="layer" id="run"><div class="hd" id="run-hd"></div><div class="ls" id="run-ls"></div><div class="ft"><button class="btn pri" id="run-btn" style="width:100%">계속</button></div></div>

  <!-- 비주얼 노벨 레이어 : 배경/스탠딩은 ASSETS에 이미지 경로만 넣으면 교체됨 -->
  <div class="layer" id="vn">
    <div id="vn-bg"></div>
    <div id="vn-deco"></div>
    <div class="fx" id="fx-vn"></div>
    <div id="vn-stand"></div>
    <div id="vn-tools"><button id="vn-auto">AUTO</button><button id="vn-skip">SKIP</button><button id="vn-logb">LOG</button></div>
    <div id="vn-choices"></div>
    <div id="vn-box"><div id="vn-name"></div><div id="vn-text"></div><div id="vn-next">▼</div></div>
    <div id="vn-card"><div class="k" id="vc-k"></div><div class="t" id="vc-t"></div><div class="s" id="vc-s"></div></div>
    <div id="vn-flash"></div>
    <div id="vn-log"><div class="ls" id="vl-ls"></div><button class="x" id="vl-x">닫기</button></div>
  </div>

  <!-- 타이틀 -->
  <div class="layer show" id="title">
    <div class="fx" id="fx-title"></div>
    <div class="moonbig"></div>
    <div class="branch">🌿</div>
    <div class="tt">
      <div class="k">大峙洞 還生錄</div>
      <h1>이화<small>(梨花)</small>에 지는 달</h1>
      <h2>대치동 환생록</h2>
    </div>
    <div class="menu">
      <button id="t-new">새로운 생(生)</button>
      <button id="t-cont">이어서 살아가기</button>
      <button id="t-codex">전생의 기억 도감</button>
    </div>
    <div class="ver">MMXXVI · 壬辰 · v1.0</div>
  </div>

  <div class="credits" id="credits"><button class="skip" id="cr-skip">SKIP ▶</button><div class="roll" id="cr-roll"></div></div>
  <div class="layer" id="modal"><div class="box" id="modal-box"></div></div>
  <div class="layer" id="ink"><div class="t" id="ink-t"></div></div>
  <div id="toast"></div>
</div>
<script>
'use strict';
/* =========================================================
   [ASSETS] 이미지 에셋 삽입 지점
   - 아래 경로에 이미지 URL(또는 data URI)을 넣으면 그라데이션 실루엣/배경 대신 이미지가 출력됩니다.
   - 예) ASSETS.chars.ian = 'img/ian.png';  ASSETS.bgs.library = 'img/bg_library.jpg';

  fit:   {n:'근력',   full:'체력 단련(근력)'}
};
const STAT_KEYS = ['int','art','sense','cha','charm','spirit','fit'];
const RES = {hp:'체력', stress:'스트레스', money:'용돈'};

/* ---------- 루트(현생 목표 / 전생) ---------- */
const ROUTES = {
  med:{ key:'med', label:'이성/생명', goal:'한국대 의대 진학', goalShort:'의사', past:'의녀 출신 의병', role:'의병 의녀',
        item:'약초 주머니와 은침', pastDream:'조선 제일의 명의', icon:'🩺', pastIcon:'🌿',
        bonus:{int:20, spirit:10}, money:0,
        desc:'생명을 살리는 손. 전생엔 침 대신 칼과 약초를 들고 부상병을 살리며 싸웠다.' },

        item:'가야금과 밀서를 숨긴 은비녀', pastDream:'조선 최고의 가무 예인', icon:'🎤', pastIcon:'🪕',
        bonus:{art:20, charm:10}, money:0,
        desc:'무대 위에서 가장 빛나는 사람. 전생엔 왜장의 연회에서 춤추며 기밀을 훔쳤다.' },

        item:'바가지 탈과 소고', pastDream:'세상을 웃기고 울리는 이야기꾼', icon:'🎬', pastIcon:'🎭',
        bonus:{sense:20, charm:10}, money:0,
        desc:'타인의 삶을 대신 살아주는 사람. 전생엔 장터를 떠도는 광대로 위장해 의병의 소식을 날랐다.' },

        item:'낡은 병법서와 붓 한 자루', pastDream:'신분의 벽이 없는 세상', icon:'💼', pastIcon:'📜',
        bonus:{cha:20}, money:200000,
        desc:'판을 읽고 사람을 움직이는 사람. 전생엔 몰락한 가문의 책사로 의병을 이끌었다.' }
};

/* ---------- 등장인물 ---------- */
const CH = {
  ian:{ name:'이안', hanja:'李安', past:'영안대군', pastHanja:'永安大君', role:'이화고 3학년 선배', pastRole:'비운의 막내 왕자',
    c1:'#fbfcff', c2:'#a7b8e6', hair:'#e9ecf6', glow:'rgba(170,195,255,.8)', emb:'🌙', bg:'linear-gradient(135deg,#eef2ff,#c7d3f5)',
    stat:'학업', where:'이화고 도서관(평일 오후) · 대치동 스터디카페(평일 야간)',
    desc:'햇빛에 녹아버릴 것처럼 하얗고 병약한 선배. 그러나 위험이 스치면 서늘한 왕자의 눈빛으로 돌변한다.',
    pastDesc:'왜란의 피란길에 홀로 버려진 열세 살의 막내 왕자. 자신을 지키다 쓰러진 의병을 그저 바라봐야만 했다.' },

  TURNS.push({y, m, ev, season, label:`${y}학년 ${m}월`});
}}

 ]},
 {min:72, s:[
  {bg:'hangang'},{fx:'snow'},
  '새벽 여섯 시. 아무도 없는 한강. 무진 선배가 처음으로 먼저 연락해서 나를 불러냈다.',
  'mujin|…말이 서툴러서, 연습했다. 백 번쯤.',

sihyun:[
 {min:0, s:[
  {bg:'music'},{fx:'none'},
  '낙원상가 3층, 먼지 쌓인 악기점. 누군가 낡은 일렉기타의 줄을 감고 있었다.',
  '탈색한 은발, 귓바퀴를 따라 박힌 피어싱, 손가락 마디마다 낀 은반지.',
  'sihyun|어. 교복에 학원 가방… 대치동 범생이 아가씨가 여긴 웬일?',
  'sihyun|길 잃었어? 학원은 저쪽, 한참 저~쪽인데.',
  {choice:[
   {t:'“악기 보러 왔는데요. 그쪽이야말로 학교 안 가요?”', aff:{sihyun:5}, st:{cha:1}, then:['sihyun|하, 이 아가씨 봐라. 이빨 있네?','sihyun|나 류시현. 학교는 때려치웠고, 음악은 못 때려치웠어. 잘 부탁해, 범생이.']},
   {t:'말없이 옆의 기타 줄을 튕겨본다', aff:{sihyun:6}, st:{art:2}, then:['맑은 소리가 악기점을 울렸다. 그가 튜닝하던 손을 멈췄다.','sihyun|……뭐야. 귀 좋네.','sihyun|방금 그 음, 반음 낮은 거 알고 튕긴 거지? 범생이 치고는… 재밌다.']}

 ]},
 {min:10, s:[
  {bg:'hongdae'},{fx:'none'},
  '홍대 지하 클럽. 무대 위에서 은발의 기타리스트가 미친 듯이 리프를 쏟아내고 있었다.',
  '류시현이었다. 무대 위의 그는, 악기점에서의 나른한 남자와 전혀 다른 짐승 같았다.',
  '공연이 끝나고, 그가 땀에 젖은 채 내 앞에 섰다.',
  'sihyun|왔네, 범생이. 세 번째 곡 브릿지에서 너 표정 변했지.',
  'sihyun|그거 내가 제일 아끼는 부분이야. 거기서 반응한 사람, 너밖에 없더라.',
  {choice:[
   {t:'“그 부분, 꼭 오래된 노래 같았어요.”', aff:{sihyun:6}, st:{spirit:2}, then:['sihyun|…오래된 노래?','그의 웃음이 멈췄다.','sihyun|그거, 꿈에서 들은 가락으로 만든 거야. 아무한테도 말 안 했는데.']},
   {t:'“무대 위에서 완전 다른 사람이던데요.”', aff:{sihyun:5}, then:['sihyun|원래 이게 진짜 나야. 밖에선 연기하는 거고.','sihyun|…너도 그렇지 않아? 대치동 범생이 연기.']}

 ]},
 {min:22, s:[
  {bg:'rooftop'},{fx:'none'},
  '클럽 건물 옥상. 시현이 기타를 내 무릎에 올려 주었다.',
  'sihyun|코드 세 개만 알면 노래 백 곡 친다. G, C, D. 따라 해.',
  '그의 손가락이 내 손가락 위에 겹쳐졌다. 굳은살이 단단했다.',
  'sihyun|……야, 범생이. 너 숨 쉬는 법 까먹은 얼굴이야.',
  'sihyun|학원, 성적, 엄마, 대학. 그거 다 내려놓고 한 번만 숨 쉬어 봐. 여기선 아무도 너 채점 안 해.',
  {choice:[
   {t:'눈을 감고, 크게 숨을 들이마신다', aff:{sihyun:6}, res:{stress:-12}, then:['밤공기가 폐 끝까지 들어왔다. 얼마 만인지 모를, 진짜 숨.','sihyun|그래. 그 얼굴. 그 얼굴로 노래하면 사람 죽인다.']},
   {t:'“…숨 쉬는 거, 가르쳐 줄래요?”', aff:{sihyun:7}, then:['sihyun|…하. 너 그런 말 아무한테나 하지 마라. 위험해.','그러면서도 그는 기타를 다시 고쳐 잡았다. 밤새 가르쳐 줄 기세로.']}
  ]}
 ]},
 {min:38, s:[
  {bg:'hongdae'},{fx:'rain'},
  '비 오는 홍대 골목. 시현의 반지하 작업실. 벽 한 면이 전부 악보였다.',
  'sihyun|집 나온 지 3년. 아빠는 내가 기타 치는 게 딴따라 짓이래. 천한 일이라고.',
  'sihyun|웃기지. 천하다는 말, 이상하게 익숙해. 몇백 년 전부터 들어온 것처럼.',

  {choice:[

   {t:'“천한 소리 같은 건 없어요. 세상에.”', aff:{sihyun:6}, st:{art:2}, then:['sihyun|범생이가 이럴 때만 멋있는 소리를 하네.','그는 고개를 숙였지만, 어깨가 웃고 있었다.']}
  ]}
 ]},
 {min:55, s:[
  {bg:'stage'},{fx:'none'},
  '시현이 내게 마이크를 건넸다. 그의 밴드 공연, 앵콜 무대였다.',
  'sihyun|한 곡만. 네 목소리로.',
  '조명이 쏟아졌다. 떨리는 목소리가 첫 소절을 열자— 클럽이 고요해졌다.',
  '노래가 끝났을 때, 시현은 기타 넥을 꽉 쥔 채 울고 있었다.',

  ]}
 ]},
 {min:72, s:[
  {bg:'rooftop'},{fx:'snow'},
  '첫눈 오는 밤, 옥상. 시현이 기타 대신 오래된 국악 음반 하나를 내밀었다. 거문고 산조.',
  'sihyun|이거 들으면 이상하게 네 생각이 나. 처음 만나기 전부터.',

  ]}
 ]}

seoha:[
 {min:0, s:[
  {bg:'daehakro'},{fx:'none'},
  '공연이 끝난 소극장. 객석을 정리하다가, 텅 빈 무대 위에 홀로 서 있는 사람을 보았다.',
  'seoha|“그대여, 이 성이 무너지거든, 나를 잊고 살아가오. 부디, 꽃 피는 봄을—”',
  '조명 하나 없이, 그는 울고 있었다. 연기인지, 진짜인지 알 수 없는 눈물이었다.',

 {min:10, s:[

 ]},
 {min:22, s:[
  {bg:'daehakro'},{fx:'none'},

   {t:'탈을 쓴 채 과장된 춤을 춰서 웃겨준다', aff:{seoha:6}, res:{stress:-6}, then:['서하 씨가 배를 잡고 웃었다. 웃다가, 왜인지 눈물을 훔쳤다.','seoha|웃는 것도 싸우는 거예요. …누가 그렇게 말했던 것 같아.']}

 ]},
 {min:38, s:[
  {bg:'daehakro'},{fx:'leaf'},
  '대학로 마로니에 공원. 서하 씨가 낡은 수첩을 펼쳐 무언가를 적고 있었다.',
  'seoha|사람을 관찰해서 적는 습관이 있어요. 배역 연구용이라고 하지만… 사실 그냥, 잊히는 게 무서워서.',

  ]}
 ]},
 {min:55, s:[
  {bg:'rain'},{fx:'rain'},

  'seoha|괜찮아요. 익숙해요. 열일곱 번째니까.',

 ]},
 {min:72, s:[

  '공연이 모두 끝난 밤, 불 꺼진 극장. 서하 씨가 무대 위 조명 하나만 켰다.',

taejun:[
 {min:0, s:[

  '진흙 속, 엎어진 가마 아래에서 작은 손 하나가 꿈틀거렸다.',
  'ian|오, 오지 마라! 나는… 나는 이 나라의 대군이다. 함부로 다가오면…',
  '열세 살이나 되었을까. 비단 도포는 흙투성이였고, 떨리는 손에 쥔 것은 칼이 아니라 부러진 붓 한 자루였다.',
  'ian|…버림받은 것이 아니다. 잠시, 길을 잃었을 뿐이다.',
  {choice:[
   {t:'무릎을 꿇고 예를 갖춘다', aff:{ian:4}, then:[
    'me|소인, {role} {name}이옵니다. 대군마마를 모시러 왔사옵니다.',
    '소년의 눈에서 참았던 것이 터져 나왔다. 그러나 그는 끝내 소리 내어 울지 않았다.',
    'ian|…일어나라. 네가 무릎을 꿇으면, 내가 무엇으로 너를 일으켜 세우겠느냐.']},
   {t:'말없이 손을 내민다', aff:{ian:6}, st:{spirit:2}, then:[
    'me|대군이든 아니든, 비를 맞으면 병이 납니다. 일단 일어나시지요.',
    'ian|…무엄하구나.',
    '그렇게 말하면서도 차가운 작은 손이 내 손을 꽉 붙잡았다. 놓으면 세상이 끝나기라도 할 것처럼.',
    'ian|따뜻하다. …네 손은, 따뜻하구나.']}
  ]},
  'ian|이름이 무엇이냐.',
  'me|{name}이옵니다.',
  'ian|{name}. 기억하겠다. 내가 살아남는다면, 반드시.',
  {stand:null},
  '그날, 나는 꿈을 하나 더 짊어졌다. {pastDream}이(가) 되겠다는 꿈 위에— 이 아이를 살려 보내겠다는 꿈을.'
]},
{ id:'ian2', ch:'ian', ep:2, title:'산중의 달', glyph:'🌙', need:{aff:40, spirit:50}, s:[
  {card:{k:'전생의 기억 · 이안 Ⅱ', t:'산중의 달', s:'깊은 산 속 버려진 암자.'}},
  {bg:'river'},{fx:'none'},
  '왜군의 수색을 피해 숨어든 암자. 대군은 매일 밤 마당에 나와 달을 보았다.',
  'ian|누이. …누이라고 불러도 되겠느냐. 궁에선 아무도 나를 동생으로 대해 주지 않았다.',
  'ian|형님들은 나를 병약한 막내라 불렀고, 아바마마께선 내 이름조차 자주 잊으셨지.',
  'ian|그런데 너는 나를 업고 산을 셋이나 넘었다. 대군이라서가 아니라, 그냥 아이라서.',
  {choice:[
   {t:'“그럼 오늘부터 누이 하겠습니다, 마마.”', aff:{ian:5}, then:['ian|마마는 빼라. 누이가 동생에게 마마라 하는 법이 어디 있느냐.','그가 처음으로 소리 내어 웃었다. 열세 살다운 웃음이었다.']},
   {t:'그에게 글을 가르쳐 달라고 청한다', aff:{ian:6}, st:{int:2}, then:['ian|글을? …좋다. 대신 너는 나에게 칼을 가르쳐라.','그날부터 달빛 아래, 그는 나에게 천자문을, 나는 그에게 칼 쥐는 법을 가르쳤다.','그의 글씨는 아름다웠다. 단정하고, 조금 쓸쓸한 글씨.']}
  ]},
  'ian|누이. 내가 크면, 이번엔 내가 너를 지키겠다.',
  'ian|칼도 배우고, 말도 타고, 키도 너보다 훨씬 커져서. 아무도 너를 해치지 못하게.',
  'me|그럼 어서 크셔야겠습니다.',
  'ian|약속이다. 달님 앞에서 한 약속은 깨지지 않는다고 했다.',
  {stand:null},
  '하얀 달이 암자 지붕 위에 걸려 있었다. 그 아이는 끝내, 나보다 키가 커지지 못했다.'
]},
{ id:'ian3', ch:'ian', ep:3, title:'무력한 손', glyph:'🖐️', need:{aff:70, spirit:90}, s:[
  {card:{k:'전생의 기억 · 이안 Ⅲ', t:'무력한 손', s:'추격대가 산을 넘어왔다.'}},
  {bg:'mountain'},{fx:'ember'},
  '횃불이 산허리를 타고 올라왔다. 왜군 추격대. 누군가 대군의 행방을 팔아넘긴 것이다.',
  'me|마마, 이 바위틈에 숨으십시오. 무슨 소리가 들려도 나오시면 안 됩니다.',
  'ian|싫다! 너도 같이—',
  'me|약속하셨지요. 크시면 저를 지켜 주신다고. 그러니 오늘은 살아남으셔야 합니다. 크셔야 하니까.',
  {shake:1},
  '칼과 칼이 부딪쳤다. 하나, 둘, 셋. 나는 바위 앞을 막아섰다.',
  '그리고 화살 하나가, 내 가슴에 박혔다.',
  {flash:'#a01010'},
  '무릎이 꺾였다. 흐려지는 시야 너머로, 바위틈의 작은 얼굴이 보였다.',
  'ian|……!',
  '그는 손을 뻗고 있었다. 그러나 그 손은 떨리기만 할 뿐, 단 한 걸음도 나오지 못했다.',
  'ian|나는… 대군인데… 이 나라의 왕자인데…',
  'ian|어째서… 아무것도… 아무것도 할 수가 없는 것이냐…!',
  {choice:[
   {t:'“나오지 마세요. …살아주세요, 마마.”', aff:{ian:6}, st:{spirit:3}, then:['그것이 내가 그에게 한 마지막 말이었다.','그는 이를 악물고 울음을 삼켰다. 내 말을 지키기 위해. 그것이 그가 할 수 있는 유일한 것이었으므로.']},
   {t:'피 묻은 손으로 그를 향해 웃어 보인다', aff:{ian:6}, st:{spirit:3}, then:['괜찮다고. 당신 탓이 아니라고. 말 대신 웃음으로.','그는 그 웃음을, 사백 년 동안 잊지 못했다.']}
  ]},
  {stand:null},{fx:'rain'},
  '비가 내렸다. 추격대가 물러간 새벽, 바위틈에서 나온 소년은 식어가는 나를 안고 있었다.',
  'ian|다음 생에는… 반드시. 반드시 내가 지키겠다.',
  'ian|아니, 지키는 것만으로는 모자라. 다음 생에는 네 곁에 나란히 서 있을 수 있는, 그런 사람으로 태어나겠다.',
  '그 맹세가, 하얀 손의 선배가 되어 나를 기다리고 있었다.'
]},

/* ===== 강무진 ===== */
{ id:'mujin1', ch:'mujin', ep:1, title:'등 뒤는 제가', glyph:'🛡️', need:{aff:15, spirit:20}, s:[
  {card:{k:'전생의 기억 · 강무진 Ⅰ', t:'등 뒤는 제가', s:'임진년 유월, 의병이 일어섰다.'}},
  {bg:'camp'},{fx:'ember'},
  '의병들이 모인 첫날 밤. 횃불 아래, 유난히 커다란 그림자가 내 앞에 섰다.',
  'mujin|…강무진이라 합니다. 관군 출신. 부대가 전멸해, 홀로 살아남았습니다.',
  '그는 내 앞에 한쪽 무릎을 꿇고 칼을 바쳤다.',
  'mujin|아씨의 등 뒤는, 제가 지키겠습니다.',
  {choice:[
   {t:'“제 등 뒤가 아니라, 우리 모두의 등 뒤를 지켜 주세요.”', aff:{mujin:5}, st:{cha:2}, then:['mujin|……예.','그는 잠시 망설이다가, 아주 작게 덧붙였다.','mujin|그래도… 아씨 등 뒤가 먼저입니다.']},
   {t:'그의 칼을 받아 다시 그의 손에 쥐여준다', aff:{mujin:6}, then:['mujin|…?','me|칼은 바치는 것이 아니라 쥐는 것입니다. 함께 싸워요, 부장.','그는 칼자루를 꽉 쥐었다. 그 손이 아주 조금, 떨리고 있었다.']}
  ]},
  {stand:null},
  '그날부터 내가 돌아보면, 언제나 거기에 그가 있었다. 한 걸음 뒤. 정확히 칼 한 자루의 거리만큼.'
]},
{ id:'mujin2', ch:'mujin', ep:2, title:'초승달 아래 칼 가는 밤', glyph:'🌒', need:{aff:40, spirit:50}, s:[
  {card:{k:'전생의 기억 · 강무진 Ⅱ', t:'초승달 아래 칼 가는 밤', s:'전투 전날 밤, 막사 뒤편.'}},
  {bg:'river'},{fx:'none'},
  '스윽, 스윽. 숫돌에 칼날이 스치는 소리. 막사 뒤편에서 무진이 홀로 칼을 갈고 있었다.',
  '그의 팔뚝에 핏자국이 배어 있었다. 낮의 전투에서 나를 감싸다 생긴 상처였다.',
  'me|부장, 팔 내놓으시오. 상처를 봐야겠습니다.',
  'mujin|…괜찮습니다.',
  'me|명령입니다.',
  '그는 마지못해 소매를 걷었다. 내가 상처를 싸매는 동안, 그는 숨도 쉬지 않는 것 같았다.',
  'mujin|……아씨.',
  'mujin|이것을.',
  '그가 투박한 손으로 무언가를 내밀었다. 작은 나무 노리개. 서툴게 깎은 배꽃 모양이었다.',
  'mujin|…전쟁 끝나면, 드리려고 했던 것입니다. 그런데 내일이 있을지 몰라서.',
  {choice:[
   {t:'“전쟁이 끝나면 다시 주세요. 그때 받을게요.”', aff:{mujin:5}, st:{spirit:2}, then:['mujin|……','그는 노리개를 다시 품에 넣었다. 소중하게, 아주 소중하게.','mujin|예. 그때… 그때 같이 드릴 말도 있습니다.']},
   {t:'노리개를 받아 허리춤에 단다', aff:{mujin:7}, then:['mujin|…!','달빛 아래 그의 얼굴이 붉어졌다. 아니, 모닥불 탓이었을지도.','mujin|어울리십니다. …아니, 그것이 아니라. 아니, 그것도 맞습니다.']}
  ]},
  {stand:null},
  '그날 그가 하려던 말을, 나는 끝내 듣지 못했다.'
]},
{ id:'mujin3', ch:'mujin', ep:3, title:'등 뒤의 칼날', glyph:'🗡️', need:{aff:70, spirit:90}, s:[
  {card:{k:'전생의 기억 · 강무진 Ⅲ', t:'등 뒤의 칼날', s:'매복. 그리고 마지막 거리, 칼 한 자루.'}},
  {bg:'field'},{fx:'ember'},
  '매복이었다. 계곡 양쪽에서 조총 소리가 터지고, 왜군이 쏟아져 내려왔다.',
  'me|퇴각! 모두 퇴각하라!',
  '병사들을 먼저 보내고 마지막으로 돌아선 순간— 등 뒤에서 차가운 바람이 느껴졌다.',
  {shake:1},
  '쨍—!',
  '돌아보았을 때, 무진의 팔뚝이 왜군의 칼날을 막고 있었다. 비스듬하게, 깊게.',
  'mujin|…등 뒤는…',
  'mujin|제가… 지킨다고… 했습니다.',
  '두 번째 칼이, 세 번째 칼이 그의 몸에 박혔다. 그는 쓰러지지 않았다. 나와 적 사이에 산처럼 서서.',
  {flash:'#a01010'},
  'mujin|가십시오, 아씨! 뒤돌아보지 마시고!',
  {choice:[
   {t:'“같이 가요, 무진!”', aff:{mujin:6}, st:{spirit:3}, then:['처음으로 그의 이름을 불렀다. 부장이 아니라, 무진이라고.','그가 아주 잠깐, 웃었다. 피투성이의 얼굴로.']},
   {t:'눈물을 삼키고 병사들을 이끌고 달린다', aff:{mujin:5}, st:{cha:2,spirit:3}, then:['나는 달렸다. 그가 지킨 등을 보이며. 그것이 그가 원한 것이었으므로.']}
  ]},
  {stand:null},
  '전투가 끝난 뒤, 계곡에서 그를 찾았다. 그는 여전히 선 채로, 바위에 기대어 있었다.',
  '품 안에서 배꽃 노리개가 떨어졌다. 그 뒷면에는 서툰 글씨로 한 글자가 새겨져 있었다.',
  '「戀(연)」',
  'mujin|(…하고 싶은 말이… 있었는데…)',
  '그 말을 하지 못한 한이, 사백 년을 건너 팔뚝의 흉터가 되었다.'
]},

/* ===== 류시현 ===== */
{ id:'sihyun1', ch:'sihyun', ep:1, title:'천민 악공의 지음', glyph:'🪕', need:{aff:15, spirit:20}, s:[
  {card:{k:'전생의 기억 · 류시현 Ⅰ', t:'천민 악공의 지음', s:'전란 전, 어느 봄밤의 주막.'}},
  {bg:'market'},{fx:'petal'},
  '주막 구석에서 거문고 소리가 흘렀다. 술꾼들은 아무도 듣지 않았다. 나만 빼고.',
  '연주가 끝나자 나도 모르게 손뼉을 쳤다. 거문고를 안은 사내가 고개를 들었다. 하얗게 센 듯한 옅은 머리칼.',
  'sihyun|…허. 천한 악공의 소리에 손뼉을 치는 이가 다 있소?',
  'me|소리에 천한 것이 어디 있습니까. 방금 그 가락, 셋째 줄에서 일부러 반음을 눌렀지요.',
  'sihyun|……',
  '그가 거문고를 내려놓았다. 나른하던 눈이 처음으로 날카롭게 빛났다.',
  'sihyun|지음(知音)이로구나.',
  'sihyun|백아가 거문고를 탔을 때 그 소리를 알아준 이는 종자기 하나뿐이었다지. 나에게도 그런 이가 생길 줄은 몰랐소.',
  {choice:[
   {t:'“한 곡 더 들려주시겠소?”', aff:{sihyun:5}, st:{art:2}, then:['sihyun|그대를 위해서라면, 밤새도록.','그날 밤, 주막의 등잔이 다 탈 때까지 그는 거문고를 탔다.']},
   {t:'“제 노래도 들어주시겠소?”', aff:{sihyun:6}, st:{art:2}, then:['내가 노래를 시작하자, 그가 즉흥으로 가락을 얹었다.','처음 맞춰 보는 소리가, 평생 함께한 것처럼 겹쳐졌다.','sihyun|…큰일이구려. 그대의 소리를 들어 버렸으니, 이제 다른 소리는 들리지 않겠소.']}
  ]}
]},
{ id:'sihyun2', ch:'sihyun', ep:2, title:'적진의 거문고', glyph:'🏮', need:{aff:40, spirit:50}, s:[
  {card:{k:'전생의 기억 · 류시현 Ⅱ', t:'적진의 거문고', s:'왜장의 연회. 현(絃) 사이에 숨긴 밀서.'}},
  {bg:'enemy'},{fx:'ember'},
  '왜장의 연회장. 붉은 등이 흔들리고, 낯선 말과 웃음소리가 가득했다.',
  '그 한가운데서 시현이 거문고를 타고 있었다. 왜장들이 흥에 겨워 박수를 쳤다.',
  '아무도 몰랐다. 그 가락이 암호라는 것을. 느린 세 번은 ‘동쪽’, 빠른 두 번은 ‘사흘 뒤’.',
  '연회가 끝나고, 나는 주모로 위장해 그의 거문고를 받아 들었다. 현 사이에 접힌 종이 한 장.',
  'sihyun|(속삭이며) 진격로는 남강을 따라 동쪽이오. 의병장께 전하시오.',
  'me|이러다 발각되면 당신은—',
  'sihyun|천한 악공 하나 죽는다고 세상이 무너지오? 하지만 그대의 의병이 이기면, 세상이 바뀌지.',
  {choice:[
   {t:'“당신은 천하지 않아요. 단 한 번도.”', aff:{sihyun:6}, st:{spirit:2}, then:['sihyun|……','sihyun|그 말 한마디 들으려고 이 짓을 하는지도 모르겠소.']},
   {t:'그의 손을 꼭 잡는다', aff:{sihyun:6}, then:['현에 베여 굳은살투성이가 된 손가락이었다.','sihyun|…이러면 연주가 흔들리지 않소. 놓으시오. 아니, 조금만 더.']}
  ]},
  {stand:null},
  '그날 받은 밀서로 의병은 매복에 성공했다. 그리고 나는, 그것이 그의 마지막 연주가 될 줄 몰랐다.'
]},
{ id:'sihyun3', ch:'sihyun', ep:3, title:'끊어진 현', glyph:'🎐', need:{aff:70, spirit:90}, s:[
  {card:{k:'전생의 기억 · 류시현 Ⅲ', t:'끊어진 현', s:'그는 끝내, 그 이름을 말하지 않았다.'}},
  {bg:'enemy'},{fx:'rain'},
  '발각되었다. 의병의 매복이 너무 정확했던 탓이었다.',
  '왜장|조선의 첩자와 내통한 자가 누구냐. 이름을 대라. 그러면 살려 주겠다.',
  '시현은 피투성이로 무릎 꿇린 채, 웃었다.',
  'sihyun|이름이라… 내가 아는 이름은 하나뿐이오. 백아와 종자기.',
  'sihyun|그 외엔, 아무것도 모르오.',
  {shake:1},
  '그들은 그의 손가락을 하나씩 부러뜨렸다. 거문고를 타던 손을.',
  '나는 성 밖 숲에서 그 모든 소리를 듣고 있었다. 숨을 죽이고. 울음을 삼키고.',
  '마지막 날 아침, 시현이 처형대에 섰다. 부러진 손 대신, 그는 노래를 불렀다.',
  'sihyun|♪ 꽃이 지네 꽃이 지네, 지음 없는 이 강산에…',
  '그것은 우리가 처음 만난 밤, 내가 불렀던 노래였다.',
  {choice:[
   {t:'숲속에서 같은 노래로 화답한다', aff:{sihyun:7}, st:{art:3,spirit:3}, then:['나는 목소리를 낮춰 노래를 이었다. 들킬지도 몰랐다. 상관없었다.','처형대 위의 그가, 아주 잠깐 숲을 바라보며 웃었다.','sihyun|(…들리오. 그대의 소리.)']},
   {t:'입을 막고, 그의 노래를 끝까지 듣는다', aff:{sihyun:5}, st:{spirit:3}, then:['그가 지키려 한 것을 지키기 위해, 나는 소리 내지 않았다.','그의 마지막 노래는, 끝까지 흔들리지 않았다.']}
  ]},
  {stand:null},{flash:'#fff'},
  '현이 끊어지는 소리가 났다.',
  '다음 생에 그는 다시 줄을 잡았다. 거문고 대신 일렉기타를. 그리고 무대 위에서 언제나 객석을 둘러보았다. 단 한 사람, 지음을 찾아서.'
]},

/* ===== 윤서하 ===== */
{ id:'seoha1', ch:'seoha', ep:1, title:'탈 쓴 광대', glyph:'🎭', need:{aff:15, spirit:20}, s:[
  {card:{k:'전생의 기억 · 윤서하 Ⅰ', t:'탈 쓴 광대', s:'피란민의 움막촌.'}},
  {bg:'camp'},{fx:'ember'},
  '피란민이 모인 움막촌. 아무도 웃지 않았다. 아이들조차.',
  '그때, 북소리가 울렸다. 하회탈을 쓴 광대 하나가 우스꽝스러운 걸음으로 모닥불 앞에 나섰다.',
  'seoha|에헴! 나는 한양에서 도망 온 양반이로다! 왜놈 소리만 들어도 갓이 먼저 도망을 가는구나!',
  '누군가 피식 웃었다. 아이 하나가 깔깔거렸다. 이윽고 움막촌 전체가 웃음으로 흔들렸다.',
  '놀음이 끝나고 탈을 벗은 그의 얼굴은, 웃고 있지 않았다. 지쳐 있었다.',
  'seoha|…웃음은 사치가 아니오. 웃을 수 있어야 내일도 살 수 있소.',
  'seoha|웃는 것도 싸우는 거요. 그대가 칼로 싸우듯이.',
  {choice:[
   {t:'“그럼 나도 함께 싸우겠소. 북을 쳐 드리리다.”', aff:{seoha:6}, st:{sense:2}, then:['seoha|하! 의병이 광대 북재비라니. 좋소, 아주 좋소.','그날 밤 우리는 두 번째 판을 벌였다. 아이들이 잠들 때까지.']},
   {t:'“당신은 누가 웃게 해 주오?”', aff:{seoha:6}, st:{spirit:2}, then:['seoha|……','그는 대답하지 못했다. 그리고 한참 뒤, 아주 작게 말했다.','seoha|방금, 그대가.']}
  ]}
]},
{ id:'seoha2', ch:'seoha', ep:2, title:'잊히지 않게', glyph:'📖', need:{aff:40, spirit:50}, s:[
  {card:{k:'전생의 기억 · 윤서하 Ⅱ', t:'잊히지 않게', s:'광대의 낡은 책.'}},
  {bg:'mansion'},{fx:'none'},
  '서하는 놀음이 없는 밤이면 등잔 아래서 무언가를 적었다.',
  'seoha|의병들의 이름이오. 어디서 왔는지, 무엇을 좋아했는지, 어떻게 죽었는지.',
  'seoha|역사는 장수의 이름만 기억하오. 백정 돌쇠가 아이를 구하고 죽은 것은 아무도 적지 않지.',
  'seoha|그러니 광대라도 적어야지. 잊히지 않게.',
  '그가 책장을 넘겼다. 거기에 내 이름이 있었다. 그리고 나에 대한, 길고 긴 기록이.',
  'seoha|「{role} {name}. {pastDream}을(를) 꿈꾸었다. 칼을 쥘 때 늘 왼손이 먼저 떨리는데, 그것을 아무도 모르게 감춘다.」',
  {choice:[
   {t:'“…어찌 그런 것까지 아시오.”', aff:{seoha:6}, then:['seoha|보고 있었으니까. 처음부터.','seoha|광대는 관객을 보는 사람이오. 그리고 나의 관객은… 줄곧 그대 하나였소.']},
   {t:'“당신의 이름은 누가 적어 주오?”', aff:{seoha:7}, st:{spirit:2}, then:['그에게서 붓을 빼앗아, 마지막 장에 적었다.','「광대 윤서하. 모두를 웃게 하고 홀로 울었다. 그 울음을, 내가 보았다.」','seoha|……이러면 내 놀음이 다 들통나지 않소.']}
  ]}
]},
{ id:'seoha3', ch:'seoha', ep:3, title:'성안의 마지막 놀음', glyph:'🏯', need:{aff:70, spirit:90}, s:[
  {card:{k:'전생의 기억 · 윤서하 Ⅲ', t:'성안의 마지막 놀음', s:'진주성 함락 전야.'}},
  {bg:'fortress'},{fx:'ember'},
  '내일이면 성이 무너질 것이다. 모두가 알고 있었다.',
  '그날 밤, 서하는 성안 마당에서 마지막 놀음판을 벌였다. 병사들도, 아낙들도, 아이들도 모두 모였다.',
  'seoha|자아, 오늘의 놀음은 ‘봄’이오! 전쟁이 끝나고, 배꽃이 피고, 모두가 집으로 돌아가는 이야기!',
  '그것은 이 성의 누구도 보지 못할 봄이었다. 그래서 모두가 웃으며 울었다.',
  '놀음이 끝나고, 그는 성벽 위에서 나를 그리고 있었다. 숯으로, 낡은 책의 마지막 장에.',
  'seoha|움직이지 마시오. 이게 마지막 기록이니.',
  'seoha|다음 생에도 그대를 알아볼 수 있도록. 아주 자세히 그려 둬야지.',
  {choice:[
   {t:'“다음 생엔 당신이 무대에, 내가 객석에 있을게요.”', aff:{seoha:6}, st:{sense:3}, then:['seoha|아니오. 다음 생엔— 내가 관객이 되겠소. 그대 무대의, 맨 첫 줄에.','seoha|그대가 무엇이 되든. 어디에 서든.']},
   {t:'그의 손에서 숯을 받아, 그의 얼굴도 그려준다', aff:{seoha:7}, st:{spirit:3}, then:['서툰 그림이었다. 그는 그것을 보고 처음으로 탈 없이 웃었다.','seoha|이제 우리 둘 다 기록되었소. 잊히지 않을 거요.']}
  ]},
  {flash:'#ff4a2a'},{shake:1},
  '새벽. 성문이 무너졌다.',
  '그는 탈을 쓰고 마지막까지 내 곁에서 싸웠다. 우리는 함께, 불타는 성안에서 산화했다.',
  {stand:null},
  '불길 속에서도 그 책은 타지 않았다고 한다. 누군가 우물 속에 던져 넣었으므로.',
  '사백 년 뒤, 대학로의 무명 배우는 꿈에서 들은 대사를 대본에 옮겨 적고 있었다.'
]},

/* ===== 한태준 ===== */
{ id:'taejun1', ch:'taejun', ep:1, title:'권문세가의 도령', glyph:'🏮', need:{aff:15, spirit:20}, s:[
  {card:{k:'전생의 기억 · 한태준 Ⅰ', t:'권문세가의 도령', s:'한양, 한 대감 댁 뒷담.'}},
  {bg:'mansion'},{fx:'none'},
  '군자금을 구하러 한양 권문세가들의 대문을 두드렸다. 모두 문전박대였다.',
  '마지막으로 찾은 한 대감 댁 뒷담. 비단 도포의 도령 하나가 담을 넘어 내 앞에 떨어졌다.',
  'taejun|…쉿! 어머니께 들키면 큰일 나오.',
  'taejun|그대가 의병이오? 마당에서 다 들었소. 대문 앞에서 그리 당당하게 말하는 여인은 처음 보았소.',
  'taejun|나는… 한 대감의 외아들이오. 내 손으로 할 수 있는 것은 아무것도 없지만.',
  {choice:[
   {t:'“할 수 있는 게 없는 사람은 없어요.”', aff:{taejun:5}, st:{cha:2}, then:['taejun|……','taejun|그대 말을 들으니, 정말 그런 것 같구려. 이상하오.']},
   {t:'“담을 넘은 것부터가 이미 시작이오.”', aff:{taejun:6}, then:['taejun|하, 하하. 그렇구려. 내 평생 처음 넘어 본 담이오.','그는 흙 묻은 도포를 털며 웃었다. 처음으로 숨을 쉬는 사람처럼.']}
  ]},
  'taejun|군자금은 내가 마련해 보겠소. 사흘 뒤, 이 뒷문에서.',
  {stand:null},
  '그 약속을 믿었다. 그 눈은 거짓말을 할 줄 모르는 눈이었으니까.'
]},
{ id:'taejun2', ch:'taejun', ep:2, title:'어머니의 그늘', glyph:'🕯️', need:{aff:40, spirit:50}, s:[
  {card:{k:'전생의 기억 · 한태준 Ⅱ', t:'어머니의 그늘', s:'사흘째 밤, 대감 댁 안채.'}},
  {bg:'mansion'},{fx:'none'},
  '— 이것은 내가 본 장면이 아니다. 그러나 꿈은, 그의 기억까지 보여주었다.',
  '태준은 패물 상자를 끌어안고 있었다. 어머니의 패물을 팔아 마련한 군자금이었다.',
  '대부인|태준아.',
  '안방 문이 열렸다. 차가운 목소리. 그의 어깨가 굳었다.',
  '대부인|그 계집에게 그것을 가져다주면, 너는 더 이상 이 집 자식이 아니다.',
  '대부인|의병? 역적이 될지도 모르는 무리에 돈을 대겠다고? 이 가문이 어떻게 지켜 온 가문인데.',
  'taejun|어머니, 그 사람들은 나라를—',
  '대부인|네가 대문을 나서는 순간, 나는 이 자리에서 목을 매겠다.',
  'taejun|……',
  {choice:[
   {t:'(꿈속에서) 그에게 들리지 않을 말을 외친다. “나와요!”', aff:{taejun:5}, st:{spirit:3}, then:['내 목소리는 닿지 않았다. 사백 년 전의 일이었으므로.','그러나 태준의 고개가, 아주 잠깐 대문 쪽으로 돌아갔다.']},
   {t:'(꿈속에서) 그의 떨리는 등을 바라본다', aff:{taejun:5}, st:{spirit:3}, then:['그는 울고 있었다. 소리 없이. 어머니가 볼 수 없도록.']}
  ]},
  {stand:null},
  '그날 밤, 그는 패물 상자를 놓지도, 들고 나서지도 못한 채 새벽을 맞았다.'
]},
{ id:'taejun3', ch:'taejun', ep:3, title:'닫힌 대문', glyph:'🚪', need:{aff:70, spirit:90}, s:[
  {card:{k:'전생의 기억 · 한태준 Ⅲ', t:'닫힌 대문', s:'약속의 날.'}},
  {bg:'mansion'},{fx:'rain'},
  '약속의 날. 나는 뒷문 앞에서 기다렸다. 비가 내렸다.',
  '한 시진. 두 시진. 문은 열리지 않았다.',
  '문 하나를 사이에 두고, 그가 서 있다는 것을 나는 알았다. 문틈으로 비단 도포 자락이 보였으니까.',
  'me|…도령. 거기 있는 것, 압니다.',
  'taejun|(…미안하오. 미안하오. 나는, 나는…)',
  '대답은 없었다. 다만 문 너머에서 누군가 무너지듯 주저앉는 소리가 들렸다.',
  {choice:[
   {t:'“원망하지 않겠습니다. 부디 강건하시오.”', aff:{taejun:6}, st:{spirit:3}, then:['나는 빈손으로 돌아섰다. 원망하지 않았다. 정말로.','그러나 그는 평생 자신을 원망했다.']},
   {t:'“다음엔 문을 열고 나오시오. 기다리겠소.”', aff:{taejun:7}, st:{spirit:3}, then:['그 말을 남기고 돌아섰다.','문 너머에서 짐승 같은 울음소리가 터졌다.']}
  ]},
  {stand:null},{fx:'ember'},
  '군량이 떨어진 의병대는 그 겨울을 넘기지 못한 이가 많았다.',
  '전쟁이 끝난 뒤, 한 대감 댁 외아들은 평생 혼인하지 않았다. 그는 매년 그날이면 뒷문을 열어 두고 하루 종일 그 앞에 앉아 있었다고 한다.',
  'taejun|(다음 생에는… 도망치지 않겠소. 반드시, 내 발로 문을 열고 나가겠소.)'
]},

/* ===== 김사야 / 사야가 ===== */
{ id:'saya1', ch:'saya', ep:1, title:'적장 사야가', glyph:'⚔️', need:{aff:15, spirit:20}, s:[
  {card:{k:'전생의 기억 · 사야 Ⅰ', t:'적장 사야가', s:'임진년 여름, 경상도의 어느 들판.'}},
  {bg:'field'},{fx:'ember'},
  '포로가 되었다. 의병대가 흩어지고, 나는 부상병들 곁에 남아 있다가 붙잡혔다.',
  '왜군 진영. 붉은 갑옷의 젊은 장수가 나를 내려다보았다. 갈색 눈동자. 조각 같은 얼굴.',
  'saya|조선 여인이 왜 도망가지 않았지? 다른 자들은 모두 달아났는데.',
  'me|부상병이 있었소. 버리고 갈 수 없었소.',
  'saya|…그중엔 우리 군사도 있었다고 들었다. 그 자의 상처도 싸매 주었다고.',
  'me|다친 사람에게 나라가 어디 있겠소.',
  '장수의 눈빛이 흔들렸다.',
  'saya|……',
  {choice:[
   {t:'“백성을 베는 것이 그대 나라 무사의 도(道)요?”', aff:{saya:6}, st:{cha:2}, then:['saya|……','saya|나는 그런 전쟁을 하러 온 것이 아니었다. 그랬는데.','그는 칼을 거두었다. 그리고 그날 밤, 내 포박을 몰래 풀어 주었다.']},
   {t:'말없이 그의 팔에 난 상처를 가리킨다', aff:{saya:7}, st:{spirit:2}, then:['그의 팔에서도 피가 흐르고 있었다.','me|그것부터 싸맵시다. 적이든 아니든.','saya|……이상한 여자로군. 이 나라는, 참 이상한 나라야.']}
  ]},
  {stand:null},
  '그는 나를 사야가(沙也可)라는 이름으로 기억하라 했다. 그 이름이, 훗날 조선의 이름이 될 줄은 그도 몰랐다.'
]},
{ id:'saya2', ch:'saya', ep:2, title:'귀화(歸化)', glyph:'🏳️', need:{aff:40, spirit:50}, s:[
  {card:{k:'전생의 기억 · 사야 Ⅱ', t:'귀화(歸化)', s:'왜장 사야가, 조선에 투항하다.'}},
  {bg:'camp'},{fx:'none'},

const rnd = (a,b) => a + Math.random()*(b-a);

function hasBatchim(ch){ const c = ch.charCodeAt(0); if(c<0xAC00||c>0xD7A3) return /[013678lmnr]$/i.test(ch); return (c-0xAC00)%28!==0; }
function josa(word, pair){ const [a,b] = pair.split('/'); return word + (hasBatchim(word.slice(-1)) ? a : b); }

const KEY = { auto:'ehwa_auto', slot:i=>'ehwa_slot'+i, meta:'ehwa_meta', set:'ehwa_settings' };

/* ---------- 텍스트 치환 ---------- */
function fill(t){
  const c = ctx(), R = ROUTES[c.route] || ROUTES.med, G = ROUTES[c.goal] || R;
  t = t.replace(/\{name\}/g, c.name).replace(/\{item\}/g, R.item).replace(/\{pastDream\}/g, R.pastDream)
       .replace(/\{role\}/g, R.role).replace(/\{past\}/g, R.past).replace(/\{goal\}/g, G.goal);
  return t.replace(/([가-힣A-Za-z0-9])(을\(를\)|이\(가\)|은\(는\)|와\(과\)|\(이\))/g, (m, w, j) => {
    const b = hasBatchim(w);
    const map = { '을(를)':b?'을':'를', '이(가)':b?'이':'가', '은(는)':b?'은':'는', '와(과)':b?'과':'와', '(이)':b?'이':'' };
    return w + map[j];
  });
}

/* ---------- 테마 · 파티클 · 전환 ---------- */
const isNight = () => app.classList.contains('night');
function setTheme(t){
  app.classList.remove('day','night'); app.classList.add(t);
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = t==='night' ? '#0f0909' : '#f6f4fa';
}
function makeFx(el, type, scale=1){
  el.innerHTML = '';
  if(!type || type==='none' || !SET.fx) return;
  const base = { petal:18, sakura:18, leaf:14, snow:30, rain:55, ember:28, ink:6 }[type] || 12;
  const n = Math.round(base*scale);
  const frag = document.createDocumentFragment();
  for(let i=0;i<n;i++){
    const p = document.createElement('i');
    p.className = 'pt ' + type;
    const dur = type==='rain' ? rnd(.55,1.1) : type==='ember' ? rnd(4,8.5) : type==='ink' ? rnd(6,11) : rnd(7,15);
    p.style.left = rnd(-5,100) + '%';
    if(type==='ink') p.style.top = rnd(5,90) + '%';
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = (-rnd(0,dur)) + 's';
    p.style.setProperty('--dx', rnd(-90,90) + 'px');
    p.style.setProperty('--rot', rnd(200,900) + 'deg');
    if(type!=='rain') p.style.opacity = rnd(.5,1);
    frag.appendChild(p);
  }
  el.appendChild(frag);
}
function mainFx(){
  if(!S){ makeFx($('#fx-main'), 'none'); return; }
  const T = TURNS[Math.min(S.turn, TURNS.length-1)];
  makeFx($('#fx-main'), SEASON_FX[T.season], .45);
}

function modal({ title='', text='', html='', input=null, buttons=[{t:'확인', v:true, pri:true}], col=false }){

const VN = { q:[], i:0, resolve:null, typing:false, full:'', auto:false, skip:false, opts:{}, log:[], stand:undefined, timer:null, typeT:null, mode:null, last:null };
const vnText = $('#vn-text'), vnName = $('#vn-name'), vnNext = $('#vn-next');

function playVN(script, opts={}){
  return new Promise(res => {
    VN.q = script.slice(); VN.i = 0; VN.resolve = res; VN.opts = opts; VN.log = []; VN.mode = null; VN.last = null;
    setTheme(opts.theme || 'day');
    vnText.textContent = ''; vnName.classList.remove('on'); vnNext.classList.remove('on');
    VN.stand = undefined; setStand(null);
    setBg(opts.bg || (isNight() ? 'dream' : 'room'));
    makeFx($('#fx-vn'), opts.fx || 'none');
    $('#vn-choices').classList.remove('on'); $('#vn-card').classList.remove('on'); $('#vn-log').classList.remove('on');
    $('#vn').classList.add('show');
    step();
  });
}
function endVN(){
  clearTimeout(VN.timer); clearInterval(VN.typeT);
  $('#vn').classList.remove('show'); makeFx($('#fx-vn'), 'none');
  VN.skip = false; $('#vn-skip').classList.remove('on');
  const r = VN.resolve; VN.resolve = null; if(r) r(VN.last);
}
function setBg(key){
  const b = BGS[key] || BGS.room, img = ASSETS.bgs[key];
  $('#vn-bg').style.background = img ? `url("${img}") center/cover no-repeat` : b.g;
  $('#vn-deco').textContent = img ? '' : b.d;
}
function standHTML(k){
  const c = CH[k], night = isNight();
  const img = (night && ASSETS.charsPast[k]) || ASSETS.chars[k];
  if(img) return `<img src="${img}" alt="${esc(c.name)}">`;
  return `<div class="sil" style="--c1:${c.c1};--c2:${c.c2};--hair:${c.hair};--glow:${c.glow}">
    <div class="hz">${night ? c.pastHanja : c.hanja}</div><div class="body"></div><div class="neck"></div>
    <div class="hair"></div><div class="head"></div><div class="emb">${c.emb}</div></div>`;
}
function setStand(k){
  if(VN.stand === k) return;
  VN.stand = k;
  const el = $('#vn-stand');
  if(!k){ el.classList.remove('on','talk'); return; }
  el.classList.remove('on');
  el.innerHTML = standHTML(k);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on','talk')));
}
function applyNodeEff(n){
  if(VN.opts.replay || !S) return;
  if(n.aff) for(const k in n.aff) S.aff[k] = clamp((S.aff[k]||0) + n.aff[k], 0, 100);
  if(n.st)  for(const k in n.st)  S.st[k] = Math.max(0, S.st[k] + n.st[k]);
  if(n.res){ if(n.res.hp) S.hp = clamp(S.hp + n.res.hp, 0, hpMax()); if(n.res.stress) S.stress = clamp(S.stress + n.res.stress, 0, 100); if(n.res.money) S.money = Math.max(0, S.money + n.res.money); }
  if(n.flag) S.flags[n.flag] = true;
  if(n.do) n.do(S);
}
function step(){
  clearTimeout(VN.timer);
  if(!VN.resolve) return;
  if(VN.i >= VN.q.length) return endVN();
  const n = VN.q[VN.i++];
  if(typeof n === 'string') return say(n);
  if(n.bg !== undefined) setBg(n.bg);
  if(n.fx !== undefined) makeFx($('#fx-vn'), n.fx);
  if(n.stand !== undefined) setStand(n.stand);
  if(n.shake){ const v = $('#vn'); v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake'); }
  if(n.flash){ const f = $('#vn-flash'); f.style.background = n.flash; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  if(n.aff || n.st || n.res || n.flag || n.do) applyNodeEff(n);
  if(n.if){ const ok = n.if(ctx()); VN.q.splice(VN.i, 0, ...((ok ? n.then : n.else) || [])); }
  if(n.route){ VN.q.splice(VN.i, 0, ...(n.route[ctx().route] || [])); }
  if(n.card) return showCard(n.card);
  if(n.choice) return showChoice(n.choice);
  step();
}
function say(raw){
  let sp = null, tx = raw;
  const k = raw.indexOf('|');
  if(k > 0 && k < 16){ sp = raw.slice(0,k); tx = raw.slice(k+1); }
  tx = fill(tx);
  let disp = null;
  if(sp){
    if(CH[sp]){ disp = isNight() ? CH[sp].past : CH[sp].name; setStand(sp); }
    else if(sp === 'me'){ disp = ctx().name; }
    else { disp = sp; if(sp !== '???') setStand(null); }
  }
  vnName.textContent = disp || ''; vnName.classList.toggle('on', !!disp);

function growthMult(){ let m = S.stress>=80 ? .6 : S.stress>=60 ? .8 : 1; if(S.hp < 25) m *= .7; return m; }
function applyEff(e, scaled=true){
  const d = {}, mult = scaled ? growthMult() : 1;
  for(const k in e){
    let v = e[k];
    if(STATS[k]){ if(v > 0) v = Math.max(1, Math.round(v*mult)); S.st[k] = Math.max(0, S.st[k] + v); }
    else if(k==='hp'){ const b = S.hp; S.hp = clamp(S.hp + v, 0, hpMax()); v = S.hp - b; }
    else if(k==='stress'){ const b = S.stress; S.stress = clamp(S.stress + v, 0, 100); v = S.stress - b; }
    else if(k==='money'){ const b = S.money; S.money = Math.max(0, S.money + v); v = S.money - b; }
    d[k] = v;
  }
  return d;
}

const PLAN_W = { med:{int:1, spirit:.6}, idol:{art:1, charm:.8}, actor:{sense:1, charm:.8}, ceo:{cha:1, int:.7} };
function recommendPlan(){
  const W = PLAN_W[S.goal];
  let hp = S.hp, st = S.stress, mo = S.money;
  S.plan = SLOTS.map((sl, i) => {
    let best = null, bs = -1e9;
    sl.opts.forEach(o => {
      const e = o.e; let sc = 0;
      for(const k in W) sc += (e[k]||0) * W[k] * 3;
      for(const k of STAT_KEYS) if(!W[k]) sc += (e[k]||0) * .4;
      const nhp = hp + (e.hp||0), nst = st + (e.stress||0), nmo = mo + (e.money||0);
      if(nmo < 0) sc -= 100;
      if(nhp < 30) sc -= (30 - nhp) * 2.2;
      if(nst > 65) sc -= (nst - 65) * 1.6;
      if(o.who && S.aff[o.who] > 0) sc += 2.5;
      sc += Math.random()*2;
      if(sc > bs){ bs = sc; best = o; }
    });
    hp += best.e.hp||0; st += best.e.stress||0; mo += best.e.money||0;
    return best.id;
  });
}

const runLs = $('#run-ls'), runBtn = $('#run-btn');
function runOpen(title, sub){ $('#run-hd').innerHTML = `${esc(title)}<span>${esc(sub)}</span>`; runLs.innerHTML = ''; runBtn.style.display = 'none'; $('#run').classList.add('show'); }
function runLog(o){

function runWait(label){ return new Promise(res => { runBtn.textContent = label; runBtn.style.display = ''; runBtn.onclick = () => { runBtn.style.display = 'none'; res(); }; runLs.scrollTop = runLs.scrollHeight; }); }
const runClose = () => $('#run').classList.remove('show');
let busy = false;

async function runWeek(){
  if(busy || !S || S.plan.some(p => !p)) return;
  busy = true;
  S.lastPlan = S.plan.slice();
  const T = TURNS[S.turn];
  runOpen(`${T.label} · 이번 주`, `${SEASON_KO[T.season]} · ${T.ev}`);
  let vnQuota = 2, broke = false;
  for(let i = 0; i < 5; i++){
    const sl = SLOTS[i], o = getOpt(i, S.plan[i]);
    await sleep(380);
    if((o.e.money||0) < 0 && S.money + o.e.money < 0){
      const d = applyEff({ hp:4, stress:3 }, false);
      runLog({ ic:'💸', tl:`${sl.label} · ${sl.time}`, b:`${o.n} 취소`, p:'용돈이 부족해 계획을 포기하고 집으로 돌아왔다. 통장 잔고를 보며 한숨을 쉬었다.', chips:chipsHTML(d), cls:'warn' });
      continue;
    }
    const d = applyEff(o.e, true);
    runLog({ ic:o.i, tl:`${sl.label} · ${sl.time} · ${o.p}`, b:o.n, p:pick(o.logs), chips:chipsHTML(d) });
    if(o.who){
      const c = o.who, first = !S.met[c];
      if(Math.random() < (first ? .72 : .5)){
        await sleep(300);
        if(vnQuota > 0){ vnQuota--; await encounter(c, o.bg); }
        else { S.aff[c] = clamp(S.aff[c] + 2, 0, 100); S.met[c] = true; runLog({ ic:CH[c].emb, b:`${CH[c].name}와(과) 잠깐 눈인사를 나눴다`.replace('와(과)', hasBatchim(CH[c].name.slice(-1))?'과':'와'), chips:affChips({[c]:2}) }); }
      }
    }
    if(S.hp <= 0){ await sickEvent(); broke = true; break; }
    if(S.stress >= 100){ await slumpEvent(); broke = true; break; }
  }
  await sleep(300);
  runLog({ ic:'🌙', b:'한 주가 끝났다', p:broke ? '계획대로 되지 않은 한 주였다. 그래도, 내일은 온다.' : '빼곡했던 시간표의 마지막 칸에 체크 표시를 했다.', cls:'sum',
    chips:`<div class="chips"><span class="chip">체력 ${S.hp}/${hpMax()}</span><span class="chip">스트레스 ${S.stress}</span><span class="chip money">💰${won(S.money)}</span></div>` });
  await runWait('하루를 마무리한다 ▶');
  await sihyunRescue(T);
  await monthEvent(T);
  if(S.turn === TURNS.length - 1){ runClose(); busy = false; return finale(); }
  const d = pickDream();
  if(d){
    runLog({ ic:'🌙', b:'밤이 깊었다', p:'눈꺼풀이 무거워졌다. 어디선가 아주 먼 북소리가, 사백 년 너머에서 들려왔다.' });
    await runWait('꿈속으로 ▶'); runClose(); await dreamSequence(d);
  }
  else { runLog({ ic:'💤', b:'꿈 없는 밤', p: pick(['이상하게 조용한 밤이었다. 꿈속의 불길도, 목소리도 없이.','어렴풋이 북소리가 들린 것 같았지만, 눈을 뜨자 기억나지 않았다.','깊이 잤다. 머리맡의 배꽃 향기가 꿈을 막아 준 것처럼.']) }); await runWait('아침이 밝았다 ▶'); runClose(); }
  busy = false;
  endTurn();
}

async function encounter(c, bg){
  const before = { ...S.aff };
  S.met[c] = true;
  const lv = S.enc[c], list = ENC[c];
  let script, gain;
  if(lv < list.length && S.aff[c] >= list[lv].min){ script = [{bg}, ...list[lv].s]; S.enc[c]++; gain = 3; }
  else { const nm = CH[c].name; script = [{bg}, `${josa(nm,'과/와')} 마주쳤다.`, pick(ENC_SMALL[c])]; gain = 2; }
  S.aff[c] = clamp(S.aff[c] + gain, 0, 100);
  S.st.spirit += 1;
  await playVN(script, { theme:'day', bg });
  setTheme('day');
  const diff = {}; for(const k of CH_ORDER) if(S.aff[k] !== before[k]) diff[k] = S.aff[k] - before[k];
  runLog({ ic:CH[c].emb, b:`${CH[c].name} — 인연이 깊어졌다`, chips:affChips(diff) });
}

function pickDream(){
  const T = TURNS[S.turn];
  const cand = DREAMS.filter(d => {
    if(d.ch === 'self' || S.mem[d.id]) return false;
    const n = d.need, a = S.aff[d.ch];
    if(!S.met[d.ch] || a < n.aff || S.st.spirit < n.spirit) return false;
    if(d.ep > 1 && !S.mem[d.ch + (d.ep-1)]) return false;
    if(n.req && !n.req.every(x => S.mem[x])) return false;
    return true;
  }).sort((a,b) => S.aff[b.ch] - S.aff[a.ch]);
  return cand[0] || null;
}

    rec('s_alive');
  } else {
    const s = S.met.saya ? SAYA_DEAD : [{bg:'winter'},{fx:'snow'},'꿈을 이룬 그해 겨울. 짧은 뉴스 한 줄이 눈에 들어왔다.','「한성국제고 졸업생 김모 군(19), 일본에서 지병으로 별세」','모르는 이름이었다. 그런데 왜인지, 가슴 한구석이 배꽃처럼 하얗게 아팠다.','어딘가에서 누군가, 나를 위해 아주 큰 박수를 쳐 준 것 같았다.'];
    await playVN([{card:{k:'EPILOGUE · 사야', t:'배꽃은 지고', s:''}}, ...s], { theme:'day' });
    rec('s_dead');
  }
  META.clears++; saveMeta();
  S.finished = true; lsDel(KEY.auto);
  const list = got.map(id => ENDINGS.find(e => e.id === id)).filter(Boolean);
  await modal({ title:'🌕 이번 생의 기록', html:`<div class="ending-card" style="padding:6px 0 10px"><div class="k">FIN</div><h2>${esc(S.name)}의 이번 생</h2>
    ${list.map(e => `<div class="ending"><div class="ic">${e.ic}</div><div>${e.t}<span>${e.s}</span></div></div>`).join('')}
    <p style="margin-top:12px">해금된 전생 기억 ${Object.keys(META.mem).length}/${DREAMS.length} · 엔딩 ${Object.keys(META.endings).length}/${ENDINGS.length}<br>전생의 기억과 엔딩은 다음 생에도 남습니다.</p></div>`,
    buttons:[{ t:'타이틀로', v:true, pri:true }] });
  S = null; toTitle();
}
function credits(){
  return new Promise(res => {
    const cr = $('#credits'), roll = $('#cr-roll');
    const cast = CH_ORDER.map(k => `${CH[k].name} <span class="sm">/ ${CH[k].past}</span>`).join('<br>');
    roll.innerHTML = `<h3>이화(梨花)에 지는 달</h3><div class="sm">대치동 환생록</div><br><br>
      <h3>主人公</h3>${esc(S.name)} <span class="sm">/ ${ROUTES[S.route].past}</span><br><br>
      <h3>因緣</h3>${cast}<br><br>
      <h3>그리고</h3>대치동의 밤을 견뎌 낸 모든 학생들과<br>사백삼십여 년 전,<br>꿈을 품에 넣고 칼을 들었던<br>이름 없는 의병들에게<br><br><br>
      <div class="sm">“꿈은, 남이 대신 꿔 주지 않습니다.”</div><br><br><br><h3>— 終 —</h3>`;
    roll.style.animation = 'none'; void roll.offsetWidth; roll.style.animation = '';
    cr.classList.add('on');
    const done = () => { cr.classList.remove('on'); roll.removeEventListener('animationend', done); res(); };
    roll.addEventListener('animationend', done);
    $('#cr-skip').onclick = done;
  });
}

/* =========================================================
   타이틀 · 새 게임
   ========================================================= */
function toTitle(){
  closeSheet(); runClose(); $('#vn').classList.remove('show');
  setTheme('day'); busy = false;
  $('#title').classList.add('show');
  $('#t-cont').disabled = !lsGet(KEY.auto);
  makeFx($('#fx-title'), 'petal', 1);
  makeFx($('#fx-main'), 'none');
}
async function newGame(){
  if(busy) return; busy = true;
  S = null; closeSheet(); runClose();
  $('#title').classList.remove('show'); makeFx($('#fx-title'), 'none');
  await inkIn('— 새 학기 전날 밤 —', 'night');
  setTheme('night');
  const p = playVN(PROLOGUE, { theme:'night', bg:'dream' });
  await inkOut(); await p;
  await inkIn('', 'day'); setTheme('day');
  const w = playVN(WAKEUP, { theme:'day', bg:'room_night' });
  await inkOut(); await w;
  let name = await modal({ title:'📔 다이어리 첫 장', text:'새 학기 다이어리의 첫 장.\n가장 먼저, 나의 이름을 적는다.', input:'서단비', buttons:[{ t:'적는다', v:true, pri:true }] });
  name = (name || '서단비').replace(/[<>|{}]/g, '').slice(0, 8) || '서단비';
  META.lastName = name;
  const tally = { med:0, idol:0, actor:0, ceo:0 };
  let last = 'med';
  for(const q of QUESTIONS){
    const r = await playVN([{ bg:'room_night' }, q.q, { choice: q.a.map(a => ({ t:a.t, v:a.r })) }], { theme:'day', bg:'room_night' });
    tally[r]++; last = r;
  }
  const max = Math.max(...Object.values(tally));
  const route = tally[last] === max ? last : Object.keys(tally).find(k => tally[k] === max);
  const R = ROUTES[route];
  S = newState(name, route);
  META.lastRoute = route; META.mem.self1 = true; META.plays++; saveMeta();
  const bonus = Object.keys(R.bonus).map(k => `${STATS[k].full} +${R.bonus[k]}`).join(', ') + (R.money ? `, 초기 용돈 +${won(R.money)}` : '');
  await modal({ title:`${R.icon} 꿈이 정해졌다`, html:`<p><b>[${R.label} 루트]</b>\n\n🎯 현생의 꿈 : <b>${R.goal}</b>\n${R.pastIcon} 전생 : <b>${R.past}</b>\n\n${R.desc}\n\n✨ 초기 보너스 : ${bonus}</p>`, buttons:[{ t:'이번 생을 시작한다', v:true, pri:true }] });
  await playVN(EVENT_TEXT.opening1, { theme:'day' });
  S.flags.open1 = true;
  setTheme('day');
  genMessages();
  UI.room = null; busy = false;
  showTab('schedule'); mainFx(); renderAll(); autosave();
}

/* ---------- 바인딩 · 초기화 ---------- */
document.querySelectorAll('#dock button').forEach(b => b.onclick = () => { if(b.dataset.tab === 'phone' && UI.tab === 'phone') UI.room = null; showTab(b.dataset.tab); });
$('#t-new').onclick = async () => {
  if(lsGet(KEY.auto) && !await modal({ title:'새로운 생', text:'진행 중인 생이 있어요.\n처음부터 다시 시작할까요?\n(전생 도감과 엔딩은 유지됩니다)', buttons:[{t:'취소',v:false},{t:'시작',v:true,pri:true}] })) return;
  newGame();
};
$('#t-cont').onclick = () => { const d = lsGet(KEY.auto); if(d) loadGame(d); };
$('#t-codex').onclick = () => { $('#title').classList.remove('show'); makeFx($('#fx-title'),'none'); UI.codexSeg = 'mem'; showTab('codex'); renderAll(); };
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('pagehide', autosave);
document.addEventListener('visibilitychange', () => { if(document.hidden) autosave(); });
toTitle();
renderAll();
</script>
