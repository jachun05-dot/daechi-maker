# 웹 플레이 링크 — main 에 푸시하면 테스트 → 빌드 → GitHub Pages 에 올린다
# 주소: https://jachun05-dot.github.io/daechi-maker/
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 (그 전엔 마지막 단계가 실패한다)
# 그림은 별도 파일로 올라가서 크기 한도 걱정이 없다 (사이트 전체 1GB)
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
